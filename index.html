<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>رونق - متجر قوائم المهام والمخططات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body.dark-mode { background-color: #1a202c; color: #f3f4f6; }
        body.dark-mode .bg-white { background-color: #2d3748 !important; color: #f3f4f6; }
        body.dark-mode .bg-gray-100 { background-color: #1a202c !important; }
        body.dark-mode .bg-gray-50 { background-color: #2d3748 !important; }
        body.dark-mode .border-gray-300 { border-color: #4a5568 !important; }
        body.dark-mode .text-gray-600 { color: #cbd5e0 !important; }
        body.dark-mode .shadow-md { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        body.dark-mode .product-card { background-color: #2d3748; }
        .nav { background: linear-gradient(135deg, #1e1b4b, #4c1d95); transition: 0.3s; }
        body.dark-mode .nav { background: linear-gradient(135deg, #0f172a, #2e1065); }
        .btn-3d { transition: all 0.08s linear; box-shadow: 0 4px 0 #1e1b4b; transform: translateY(-2px); }
        .btn-3d:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e1b4b; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeUp { animation: fadeUp 0.6s ease-out forwards; }
        .product-card { transition: transform 0.3s, box-shadow 0.3s; opacity: 0; transform: translateY(20px); animation: fadeUp 0.5s ease-out forwards; }
        .product-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 25px 30px -12px rgba(0,0,0,0.25); }
        .social-icon { transition: transform 0.2s; display: inline-block; }
        .social-icon:hover { transform: scale(1.15); filter: drop-shadow(0 0 8px #4f46e5); }
        .gallery-arrow { background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; top: 50%; transform: translateY(-50%); }
        .view { display: none; animation: fade 0.2s; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .search-box { transition: all 0.3s; position: relative; }
        .search-box:focus-within { transform: scale(1.01); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .toast-notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2937; color: white; padding: 12px 24px; border-radius: 50px; display: flex; gap: 10px; z-index: 1000; direction: rtl; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-notification.success { background: #10b981; }
        .toast-notification.error { background: #ef4444; }
        .voice-btn { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #6b7280; }
        .voice-btn:hover { color: #4f46e5; }
        .voice-btn.listening { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.2); } 100% { transform: translateY(-50%) scale(1); } }
        @media (max-width: 768px) { .container { padding-left: 12px; padding-right: 12px; } }
        .logout-btn { background-color: #dc2626; margin-right: 8px; }
        .category-card { cursor: pointer; transition: all 0.3s; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100">

<nav class="nav text-white shadow-lg sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
        <div id="brandName" class="text-2xl font-bold cursor-pointer select-none">✨ رونق</div>
        <div class="flex gap-4 items-center flex-wrap">
            <button onclick="app.navigate('home')" class="hover:bg-white/20 px-3 py-1 rounded-full transition">الرئيسية</button>
            <button onclick="app.navigate('products')" class="hover:bg-white/20 px-3 py-1 rounded-full transition">المنتجات</button>
            <button onclick="app.navigate('cart')" class="relative hover:bg-white/20 px-3 py-1 rounded-full transition">
                السلة <span id="cartCount" class="absolute -top-2 -right-3 bg-red-500 text-white text-xs rounded-full px-1.5">0</span>
            </button>
            <button id="adminPanelBtn" onclick="app.navigate('admin')" class="hidden bg-green-700 px-3 py-1 rounded-full transition">📋 إدارة المنتجات</button>
            <button id="logoutAdminBtn" onclick="app.logoutAdmin()" class="hidden logout-btn px-3 py-1 rounded-full transition">🚪 خروج الأدمن</button>
            <button id="darkModeToggle" class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded-full transition">🌙</button>
        </div>
    </div>
</nav>

<div class="container mx-auto px-4 py-6">
    <!-- الرئيسية -->
    <div id="homeView" class="view">
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl text-white p-8 mb-8 text-center animate-fadeUp">
            <h1 class="text-4xl font-bold">مرحباً بك في رونق</h1>
            <p class="text-lg mt-2">نظم حياتك بأفضل قوائم المهام والمخططات</p>
            <button onclick="app.navigate('products')" class="mt-4 bg-white text-indigo-700 px-6 py-2 rounded-full font-bold btn-3d">تسوق الآن</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="category-card bg-white rounded-2xl shadow-md p-6 text-center" onclick="app.filterAndNavigate('todolists')">
                <i class="fas fa-check-circle text-5xl text-indigo-600 mb-3"></i>
                <h3 class="text-2xl font-bold">📋 قوائم المهام</h3>
            </div>
            <div class="category-card bg-white rounded-2xl shadow-md p-6 text-center" onclick="app.filterAndNavigate('planners')">
                <i class="fas fa-calendar-alt text-5xl text-indigo-600 mb-3"></i>
                <h3 class="text-2xl font-bold">📅 مخططات شهرية</h3>
            </div>
            <div class="category-card bg-white rounded-2xl shadow-md p-6 text-center" onclick="app.filterAndNavigate('others')">
                <i class="fas fa-pen-alt text-5xl text-indigo-600 mb-3"></i>
                <h3 class="text-2xl font-bold">✨ أخرى</h3>
            </div>
        </div>
        <div class="mt-12 bg-gray-50 rounded-2xl p-6 text-center">
            <div class="flex justify-center gap-8">
                <a href="https://www.facebook.com/profile.php?id=61556868793384" target="_blank" class="social-icon text-6xl text-blue-700"><i class="fab fa-facebook"></i></a>
                <a href="https://www.instagram.com/rawnaq_stoore" target="_blank" class="social-icon text-6xl text-pink-600"><i class="fab fa-instagram"></i></a>
                <a href="https://t.me/Rawnaq_Stoore" target="_blank" class="social-icon text-6xl text-blue-500"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
        <div id="activeUsersCounter" class="mt-6 text-center hidden">
            <div class="inline-block bg-indigo-100 text-indigo-800 px-6 py-3 rounded-full shadow"><i class="fas fa-users ml-2"></i> يتسوق معك الآن <span id="activeUsersCount">0</span> شخص</div>
        </div>
    </div>

    <!-- المنتجات -->
    <div id="productsView" class="view">
        <div class="flex flex-wrap gap-4 mb-4">
            <select id="filterCat" class="border p-2 rounded"><option value="all">كل التصنيفات</option><option value="todolists">📋 قوائم المهام</option><option value="planners">📅 مخططات شهرية</option><option value="others">✨ أخرى</option></select>
            <select id="filterPrice" class="border p-2 rounded"><option value="">ترتيب حسب السعر</option><option value="low">الأقل سعراً</option><option value="high">الأعلى سعراً</option></select>
        </div>
        <div class="mb-6 relative max-w-md">
            <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج" class="w-full pr-10 pl-12 py-3 border rounded-2xl">
            <button id="voiceSearchBtn" class="voice-btn"><i class="fas fa-microphone"></i></button>
        </div>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <!-- تفاصيل -->
    <div id="detailView" class="view">
        <div class="bg-white rounded-2xl shadow p-6 relative">
            <img id="detailImg" class="w-full max-h-96 object-contain rounded-lg">
            <button id="prevBtn" onclick="app.prevImage()" class="gallery-arrow left-2">❮</button>
            <button id="nextBtn" onclick="app.nextImage()" class="gallery-arrow right-2">❯</button>
            <h2 id="detailName" class="text-3xl font-bold mt-4"></h2>
            <p id="detailPrice" class="text-2xl text-green-700"></p>
            <p><strong>التصنيف:</strong> <span id="detailCat"></span></p>
            <p id="detailDesc" class="mt-3 text-gray-600"></p>
            <button onclick="app.addToCartFromDetail()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-full btn-3d">➕ أضف للسلة</button>
        </div>
    </div>

    <!-- السلة -->
    <div id="cartView" class="view">
        <h2 class="text-2xl font-bold mb-4">سلة المشتريات</h2>
        <div id="cartItems" class="bg-white rounded-xl shadow p-4"></div>
        <div class="mt-4 text-left"><p class="text-xl">الإجمالي: <span id="cartTotal">0</span> ج.م</p><button onclick="app.navigate('checkout')" class="mt-3 bg-emerald-600 text-white px-8 py-2 rounded-full btn-3d">إتمام الشراء</button></div>
    </div>

    <!-- إتمام الشراء -->
    <div id="checkoutView" class="view">
        <div class="bg-white p-6 rounded-2xl shadow max-w-lg mx-auto">
            <h2 class="text-2xl font-bold mb-4">بيانات الشحن</h2>
            <input id="custName" placeholder="الاسم الكامل" class="w-full border p-2 mb-3 rounded">
            <textarea id="custAddress" placeholder="العنوان" class="w-full border p-2 mb-3 rounded"></textarea>
            <button onclick="app.sendWhatsApp()" class="bg-green-600 text-white w-full py-2 rounded-xl text-lg btn-3d">إتمام الشراء</button>
        </div>
    </div>

    <!-- لوحة الأدمن -->
    <div id="adminView" class="view">
        <div class="bg-white rounded-2xl shadow p-6 mb-6">
            <div class="flex gap-4 mb-4 flex-wrap">
                <button onclick="exportProducts()" class="bg-green-600 text-white px-4 py-2 rounded-full">📤 تصدير المنتجات (JSON)</button>
                <input type="file" id="importFile" accept=".json" class="border p-2 rounded">
                <button onclick="importProducts()" class="bg-blue-600 text-white px-4 py-2 rounded-full">📥 استيراد المنتجات</button>
            </div>
            <h2 class="text-2xl font-bold mb-4">➕ إضافة منتج جديد</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="prodName" placeholder="اسم المنتج" class="border p-2 rounded">
                <input type="number" id="prodPrice" placeholder="السعر" class="border p-2 rounded">
                <select id="prodCategory" class="border p-2 rounded"><option value="todolists">📋 قوائم المهام</option><option value="planners">📅 مخططات شهرية</option><option value="others">✨ أخرى</option></select>
                <textarea id="prodDesc" placeholder="الوصف" class="border p-2 rounded" rows="2"></textarea>
                <div class="col-span-2"><label>الصورة الرئيسية</label><input type="file" id="prodMainImage" accept="image/*" class="border p-2 rounded w-full"><div id="mainImagePreview" class="mt-2"></div></div>
                <div class="col-span-2"><label>صور إضافية</label><input type="file" id="prodGalleryImages" accept="image/*" multiple class="border p-2 rounded w-full"><div id="galleryPreview" class="mt-2 flex flex-wrap gap-2"></div></div>
            </div>
            <button onclick="app.addProduct()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-full btn-3d">حفظ المنتج</button>
        </div>
        <div class="bg-white rounded-2xl shadow p-6"><h2 class="text-2xl font-bold mb-4">📦 المنتجات الحالية</h2><div id="adminProductsList"></div></div>
        <div class="mt-4 text-center"><button onclick="app.logoutAdmin()" class="bg-red-600 text-white px-6 py-2 rounded-full btn-3d">🚪 خروج الأدمن</button></div>
    </div>
</div>
<div id="toastContainer"></div>

<script>
    // ========== تخزين المنتجات والسلة ==========
    const STORAGE_PRODUCTS = 'my_products';
    const STORAGE_CART = 'my_cart';
    const STORAGE_CURRENT_PAGE = 'current_page';
    const ADMIN_PASSWORD = 'admin123';
    const STORAGE_DARK_MODE = 'dark_mode';

    // المنتجات الافتراضية (15 منتجاً)
    const defaultProducts = [
        { id: 'p1', name: 'مفكرة قائمة المهام اليومية', price: 45, category: 'todolists', description: 'دفتر صغير بتصميم أنيق يحتوي على 50 ورقة', imageUrl: 'https://picsum.photos/id/20/400/300', images: ['https://picsum.photos/id/20/400/300','https://picsum.photos/id/21/400/300'] },
        { id: 'p2', name: 'لوحة مغناطيسية للتخطيط الأسبوعي', price: 120, category: 'planners', description: 'لوحة بيضاء مغناطيسية بحجم A3', imageUrl: 'https://picsum.photos/id/40/400/300', images: ['https://picsum.photos/id/40/400/300','https://picsum.photos/id/41/400/300'] },
        { id: 'p3', name: 'ملصقات ملونة لتنظيم المهام', price: 25, category: 'others', description: 'مجموعة من 100 ملصق', imageUrl: 'https://picsum.photos/id/30/400/300', images: ['https://picsum.photos/id/30/400/300','https://picsum.photos/id/31/400/300'] },
        { id: 'p4', name: 'مخطط شهري حائطي كبير', price: 85, category: 'planners', description: 'مخطط حجم كبير 70*100 سم', imageUrl: 'https://picsum.photos/id/50/400/300', images: ['https://picsum.photos/id/50/400/300','https://picsum.photos/id/51/400/300'] },
        { id: 'p5', name: 'دفتر قوائم التسوق', price: 30, category: 'todolists', description: 'دفتر صغير مع مقسمات', imageUrl: 'https://picsum.photos/id/60/400/300', images: ['https://picsum.photos/id/60/400/300','https://picsum.photos/id/61/400/300'] },
        { id: 'p6', name: 'حامل هاتف مع لوحة أسبوعية', price: 95, category: 'planners', description: 'حامل أكريليك شفاف', imageUrl: 'https://picsum.photos/id/70/400/300', images: ['https://picsum.photos/id/70/400/300','https://picsum.photos/id/71/400/300'] },
        { id: 'p7', name: 'أقلام تحديد قابلة للمسح', price: 40, category: 'others', description: '5 أقلام بألوان مختلفة', imageUrl: 'https://picsum.photos/id/80/400/300', images: ['https://picsum.photos/id/80/400/300','https://picsum.photos/id/81/400/300'] },
        { id: 'p8', name: 'مفكرة أهداف ذكية', price: 65, category: 'todolists', description: 'مفكرة بتصميم فريد', imageUrl: 'https://picsum.photos/id/90/400/300', images: ['https://picsum.photos/id/90/400/300','https://picsum.photos/id/91/400/300'] },
        { id: 'p9', name: 'تطبيق إلكتروني لتنظيم المهام', price: 150, category: 'todolists', description: 'رابط تحميل تطبيق', imageUrl: 'https://picsum.photos/id/100/400/300', images: ['https://picsum.photos/id/100/400/300','https://picsum.photos/id/101/400/300'] },
        { id: 'p10', name: 'دفتر تتبع العادات', price: 55, category: 'planners', description: 'دفتر لمتابعة العادات', imageUrl: 'https://picsum.photos/id/110/400/300', images: ['https://picsum.photos/id/110/400/300','https://picsum.photos/id/111/400/300'] },
        { id: 'p11', name: 'مجموعة ملصقات تحفيزية', price: 35, category: 'others', description: '20 ملصق', imageUrl: 'https://picsum.photos/id/120/400/300', images: ['https://picsum.photos/id/120/400/300','https://picsum.photos/id/121/400/300'] },
        { id: 'p12', name: 'لوحة تنظيم الأعمال المنزلية', price: 110, category: 'planners', description: 'لوحة خشبية', imageUrl: 'https://picsum.photos/id/130/400/300', images: ['https://picsum.photos/id/130/400/300','https://picsum.photos/id/131/400/300'] },
        { id: 'p13', name: 'قلم جاف ذكي مع شاشة', price: 200, category: 'others', description: 'قلم رقمي', imageUrl: 'https://picsum.photos/id/140/400/300', images: ['https://picsum.photos/id/140/400/300','https://picsum.photos/id/141/400/300'] },
        { id: 'p14', name: 'دفتر الأولويات الأسبوعي', price: 48, category: 'todolists', description: 'دفتر صغير', imageUrl: 'https://picsum.photos/id/150/400/300', images: ['https://picsum.photos/id/150/400/300','https://picsum.photos/id/151/400/300'] },
        { id: 'p15', name: 'مخطط رقمي PDF قابل للطباعة', price: 25, category: 'planners', description: 'ملف PDF', imageUrl: 'https://picsum.photos/id/160/400/300', images: ['https://picsum.photos/id/160/400/300','https://picsum.photos/id/161/400/300'] }
    ];

    let products = [], cart = [], isAdmin = false;
    let currentDetailProduct = null, currentImages = [], currentImageIndex = 0;
    let isMobile = false, recognition = null, isListening = false, activeUsersInterval = null;

    // دوال مساعدة
    function showToast(msg, type='success') {
        const cont = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast-notification ${type}`;
        toast.innerHTML = `${type==='success'?'<i class="fas fa-check-circle"></i>':'<i class="fas fa-exclamation-triangle"></i>'} <span>${msg}</span>`;
        cont.appendChild(toast);
        setTimeout(()=>toast.classList.add('show'),10);
        setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(),300); },3000);
    }
    function loadData() {
        const stored = localStorage.getItem(STORAGE_PRODUCTS);
        if(stored) products = JSON.parse(stored);
        else { products = defaultProducts; saveProducts(); }
        const cartStored = localStorage.getItem(STORAGE_CART);
        cart = cartStored ? JSON.parse(cartStored) : [];
        updateCartCount();
        isAdmin = localStorage.getItem('isAdmin') === 'true';
        if(isMobile && isAdmin) { isAdmin=false; localStorage.removeItem('isAdmin'); }
    }
    function saveProducts() { localStorage.setItem(STORAGE_PRODUCTS, JSON.stringify(products)); }
    function saveCart() { localStorage.setItem(STORAGE_CART, JSON.stringify(cart)); updateCartCount(); }
    function updateCartCount() { document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.quantity,0); }

    // تصدير واستيراد المنتجات
    function exportProducts() {
        const data = JSON.stringify(products, null, 2);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ronaq_products.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('تم تصدير المنتجات بنجاح', 'success');
    }
    function importProducts() {
        const fileInput = document.getElementById('importFile');
        if(!fileInput.files.length) { showToast('اختر ملف JSON أولاً', 'error'); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if(Array.isArray(imported)) {
                    products = imported;
                    saveProducts();
                    renderAllProducts();
                    renderAdminList();
                    showToast('تم استيراد المنتجات بنجاح', 'success');
                } else throw new Error();
            } catch(err) { showToast('الملف غير صالح', 'error'); }
        };
        reader.readAsText(fileInput.files[0]);
    }

    // عرض المنتجات
    function renderProductsGrid(containerId, list) {
        const container = document.getElementById(containerId);
        if(!container) return;
        if(list.length===0) { container.innerHTML='<div class="text-center py-10">لا توجد منتجات</div>'; return; }
        container.innerHTML = list.map(p => `
            <div class="bg-white rounded-2xl shadow-md overflow-hidden product-card">
                <img src="${p.imageUrl}" class="h-48 w-full object-cover">
                <div class="p-4">
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <div class="flex justify-between items-center mt-2"><span class="text-xl font-bold text-emerald-700">${p.price} ج.م</span></div>
                    <button onclick="app.addToCart('${p.id}')" class="mt-3 w-full bg-indigo-600 text-white py-2 rounded-xl btn-3d">➕ أضف للسلة</button>
                    <button onclick="app.showDetail('${p.id}')" class="mt-2 w-full border border-indigo-600 text-indigo-600 py-1 rounded-xl">🔍 تفاصيل</button>
                </div>
            </div>
        `).join('');
    }
    function getFilteredProducts() {
        let f = [...products];
        const cat = document.getElementById('filterCat')?.value;
        const priceOrder = document.getElementById('filterPrice')?.value;
        const search = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
        if(cat && cat !== 'all') f = f.filter(p => p.category === cat);
        if(search) f = f.filter(p => p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search));
        if(priceOrder === 'low') f.sort((a,b)=>a.price-b.price);
        if(priceOrder === 'high') f.sort((a,b)=>b.price-a.price);
        return f;
    }
    function renderAllProducts() { renderProductsGrid('productsGrid', getFilteredProducts()); }
    function refreshFilters() { renderAllProducts(); }
    function filterAndNavigate(cat) { const f=document.getElementById('filterCat'); if(f) f.value=cat; navigate('products'); setTimeout(refreshFilters,100); }
    function showDetail(id) {
        const p = products.find(p=>p.id===id);
        if(!p) return;
        currentDetailProduct = p;
        currentImages = p.images || [p.imageUrl];
        currentImageIndex = 0;
        document.getElementById('detailImg').src = currentImages[0];
        document.getElementById('detailName').innerText = p.name;
        document.getElementById('detailPrice').innerHTML = `${p.price} ج.م`;
        document.getElementById('detailDesc').innerText = p.description;
        let cn = {todolists:'📋 قوائم المهام', planners:'📅 مخططات شهرية', others:'✨ أخرى'}[p.category];
        document.getElementById('detailCat').innerText = cn;
        const prev=document.getElementById('prevBtn'), next=document.getElementById('nextBtn');
        if(currentImages.length>1) { prev.style.display='flex'; next.style.display='flex'; }
        else { prev.style.display='none'; next.style.display='none'; }
        navigate('detail');
    }
    function nextImage() { if(currentImages.length){ currentImageIndex=(currentImageIndex+1)%currentImages.length; document.getElementById('detailImg').src=currentImages[currentImageIndex]; } }
    function prevImage() { if(currentImages.length){ currentImageIndex=(currentImageIndex-1+currentImages.length)%currentImages.length; document.getElementById('detailImg').src=currentImages[currentImageIndex]; } }

    // السلة
    function addToCart(id) {
        const p = products.find(p=>p.id===id);
        if(!p) return;
        const existing = cart.find(i=>i.id===id);
        if(existing) existing.quantity++;
        else cart.push({id:p.id, name:p.name, price:p.price, image:p.imageUrl, quantity:1});
        saveCart();
        showToast(`✅ تم إضافة ${p.name} إلى السلة`,'success');
        renderCart();
    }
    function addToCartFromDetail() { if(currentDetailProduct) addToCart(currentDetailProduct.id); }
    function updateCartItem(id, delta) {
        const idx = cart.findIndex(i=>i.id===id);
        if(idx!==-1) {
            cart[idx].quantity += delta;
            if(cart[idx].quantity <= 0) cart.splice(idx,1);
            saveCart();
            renderCart();
        }
    }
    function removeCartItem(id) { cart = cart.filter(i=>i.id!==id); saveCart(); renderCart(); showToast('🗑️ تم الإزالة','success'); }
    function renderCart() {
        const con = document.getElementById('cartItems'), totalSpan = document.getElementById('cartTotal');
        if(!con) return;
        if(cart.length===0) { con.innerHTML='<div class="text-center py-8">السلة فارغة</div>'; totalSpan.innerText='0'; return; }
        let total=0;
        con.innerHTML = cart.map(item=>{
            const it = item.price * item.quantity;
            total += it;
            return `<div class="flex justify-between items-center border-b pb-3 mb-3"><div class="flex gap-3"><img src="${item.image}" class="w-16 h-16 object-cover rounded"><div><p class="font-bold">${item.name}</p><p>${item.price} ج.م</p></div></div><div class="flex items-center gap-2"><button onclick="app.updateCartItem('${item.id}', -1)" class="bg-gray-200 px-2 rounded">-</button><span>${item.quantity}</span><button onclick="app.updateCartItem('${item.id}', 1)" class="bg-gray-200 px-2 rounded">+</button><button onclick="app.removeCartItem('${item.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div></div>`;
        }).join('');
        totalSpan.innerText = total;
    }
    function sendWhatsApp() {
        const name = document.getElementById('custName').value.trim();
        const addr = document.getElementById('custAddress').value.trim();
        if(!name || !addr) { showToast('❌ يرجى ملء بيانات الشحن','error'); return; }
        if(cart.length===0) { showToast('❌ السلة فارغة','error'); return; }
        let items='', total=0;
        cart.forEach(i=>{ const it=i.price*i.quantity; total+=it; items+=`• ${i.name} x ${i.quantity} = ${it} ج.م\n`; });
        const msg = `🛍️ طلب جديد\n\nالعميل: ${name}\nالعنوان: ${addr}\n\nالمنتجات:\n${items}\nالإجمالي: ${total} ج.م`;
        window.open(`https://wa.me/201112841647?text=${encodeURIComponent(msg)}`,'_blank');
        cart = []; saveCart(); renderCart(); showToast('✅ تم إرسال الطلب','success'); navigate('home');
    }

    // إدارة المنتجات
    async function addProduct() {
        if(!isAdmin || isMobile) { showToast('غير مصرح','error'); return; }
        const name = document.getElementById('prodName').value.trim();
        const price = parseFloat(document.getElementById('prodPrice').value);
        const cat = document.getElementById('prodCategory').value;
        const desc = document.getElementById('prodDesc').value.trim();
        const mainFile = document.getElementById('prodMainImage').files[0];
        const galleryFiles = document.getElementById('prodGalleryImages').files;
        if(!name || isNaN(price) || !desc) { showToast('املأ الحقول الأساسية','error'); return; }
        if(!mainFile) { showToast('اختر صورة رئيسية','error'); return; }
        showToast('جاري رفع الصور...','success');
        const mainBase64 = await fileToBase64(mainFile);
        const galleryBase64 = [];
        for(let i=0;i<galleryFiles.length;i++) galleryBase64.push(await fileToBase64(galleryFiles[i]));
        const allImages = [mainBase64, ...galleryBase64];
        const newId = 'p'+Date.now();
        const newProduct = { id:newId, name, price, category:cat, description:desc, imageUrl:mainBase64, images:allImages };
        products.push(newProduct);
        saveProducts();
        renderAllProducts();
        renderAdminList();
        document.getElementById('prodName').value=''; document.getElementById('prodPrice').value=''; document.getElementById('prodDesc').value='';
        document.getElementById('prodMainImage').value=''; document.getElementById('prodGalleryImages').value='';
        document.getElementById('mainImagePreview').innerHTML=''; document.getElementById('galleryPreview').innerHTML='';
        showToast('تم إضافة المنتج','success');
    }
    function deleteProduct(id) {
        if(!isAdmin || isMobile) return;
        if(confirm('حذف المنتج؟')) { products = products.filter(p=>p.id!==id); saveProducts(); renderAllProducts(); renderAdminList(); showToast('تم الحذف','success'); }
    }
    function renderAdminList() {
        const con = document.getElementById('adminProductsList');
        if(!con) return;
        if(products.length===0) { con.innerHTML='<div class="text-center py-4">لا توجد منتجات</div>'; return; }
        con.innerHTML = products.map(p=>`<div class="flex justify-between items-center border-b p-3"><div class="flex gap-2"><img src="${p.imageUrl}" class="w-10 h-10 object-cover rounded"><strong>${p.name}</strong> - ${p.price} ج.م</div><button onclick="app.deleteProduct('${p.id}')" class="text-red-500"><i class="fas fa-trash"></i> حذف</button></div>`).join('');
    }
    function fileToBase64(file) { return new Promise((r,rej)=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.onerror=rej; rd.readAsDataURL(file); }); }
    function setupImagePreviews() {
        const main = document.getElementById('prodMainImage');
        const gallery = document.getElementById('prodGalleryImages');
        if(main) main.addEventListener('change',e=>{ const p=document.getElementById('mainImagePreview'); p.innerHTML=''; if(e.target.files[0]){ const img=document.createElement('img'); img.src=URL.createObjectURL(e.target.files[0]); img.className='preview-img'; p.appendChild(img); } });
        if(gallery) gallery.addEventListener('change',e=>{ const p=document.getElementById('galleryPreview'); p.innerHTML=''; Array.from(e.target.files).forEach(f=>{ const img=document.createElement('img'); img.src=URL.createObjectURL(f); img.className='preview-img'; p.appendChild(img); }); });
    }

    // صوتي
    function initVoiceSearch() {
        const btn=document.getElementById('voiceSearchBtn'), inp=document.getElementById('searchInput');
        if(!btn||!inp) return;
        if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)) { btn.style.display='none'; return; }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition(); recognition.lang='ar-EG'; recognition.continuous=false;
        btn.addEventListener('click',()=>{
            if(isListening){ recognition.stop(); return; }
            try{ recognition.start(); isListening=true; btn.classList.add('listening'); showToast('🎤 تحدث...','success'); } catch(e){ showToast('خطأ في الميكروفون','error'); }
        });
        recognition.onresult=e=>{ inp.value=e.results[0][0].transcript; refreshFilters(); btn.classList.remove('listening'); isListening=false; };
        recognition.onerror=()=>{ btn.classList.remove('listening'); isListening=false; };
        recognition.onend=()=>{ btn.classList.remove('listening'); isListening=false; };
    }

    // الوضع المظلم
    function initDarkMode() {
        const toggle=document.getElementById('darkModeToggle');
        const isDark=localStorage.getItem(STORAGE_DARK_MODE)==='true';
        if(isDark) document.body.classList.add('dark-mode');
        toggle.addEventListener('click',()=>{ document.body.classList.toggle('dark-mode'); const dark=document.body.classList.contains('dark-mode'); localStorage.setItem(STORAGE_DARK_MODE,dark); toggle.innerHTML=dark?'☀️':'🌙'; });
        toggle.innerHTML=isDark?'☀️':'🌙';
    }
    function initTypingEffect() {
        const brand=document.getElementById('brandName');
        const original=brand.innerText; brand.innerText=''; let i=0;
        function type(){ if(i<original.length){ brand.innerText+=original.charAt(i); i++; setTimeout(type,150); } else brand.style.borderLeft='none'; }
        type();
    }
    function startActiveUsersCounter() {
        if(!isAdmin) return;
        const div=document.getElementById('activeUsersCounter'), span=document.getElementById('activeUsersCount');
        if(!div||!span) return;
        div.classList.remove('hidden');
        function update(){ span.innerText=Math.floor(Math.random()*20)+3; }
        update();
        if(activeUsersInterval) clearInterval(activeUsersInterval);
        activeUsersInterval = setInterval(update,60000);
    }
    function stopActiveUsersCounter() {
        if(activeUsersInterval) clearInterval(activeUsersInterval);
        const div=document.getElementById('activeUsersCounter'); if(div) div.classList.add('hidden');
    }

    // التنقل
    function navigate(page, addToHistory=true) {
        let vid='';
        if(page==='home') vid='homeView';
        else if(page==='products') vid='productsView';
        else if(page==='cart') vid='cartView';
        else if(page==='checkout') vid='checkoutView';
        else if(page==='detail') vid='detailView';
        else if(page==='admin') vid='adminView';
        else return;
        if(page==='admin' && (isMobile||!isAdmin)) { showToast('غير مصرح','error'); return; }
        document.querySelectorAll('.view').forEach(v=>v.style.display='none');
        document.getElementById(vid).style.display='block';
        localStorage.setItem(STORAGE_CURRENT_PAGE,page);
        if(page==='products') renderAllProducts();
        if(page==='cart') renderCart();
        if(page==='admin' && isAdmin && !isMobile) renderAdminList();
        window.scrollTo(0,0);
        if(addToHistory) history.pushState({page},'',`#${page}`);
        if(page==='home' && isAdmin) startActiveUsersCounter();
        else stopActiveUsersCounter();
    }
    function handlePopState(e) { const s=e.state; if(s&&s.page) navigate(s.page,false); else { const last=localStorage.getItem(STORAGE_CURRENT_PAGE)||'home'; navigate(last,false); } }
    function handleBrandClick(e) {
        if(isMobile) return;
        if(e.shiftKey){
            const pwd=prompt('كلمة سر الأدمن:');
            if(pwd===ADMIN_PASSWORD){
                isAdmin=true; localStorage.setItem('isAdmin','true');
                showToast('تم الدخول كأدمن','success');
                document.getElementById('adminPanelBtn').classList.remove('hidden');
                document.getElementById('logoutAdminBtn').classList.remove('hidden');
                renderAllProducts();
                if(document.getElementById('homeView').style.display!=='none') startActiveUsersCounter();
            } else if(pwd!==null) showToast('كلمة سر خاطئة','error');
        }
    }
    function logoutAdmin() {
        if(!isAdmin) return;
        isAdmin=false; localStorage.removeItem('isAdmin');
        document.getElementById('adminPanelBtn').classList.add('hidden');
        document.getElementById('logoutAdminBtn').classList.add('hidden');
        showToast('تم الخروج من وضع الأدمن','success');
        stopActiveUsersCounter();
        renderAllProducts();
        if(document.getElementById('adminView').style.display!=='none') navigate('home');
    }
    function restorePage() {
        const last = localStorage.getItem(STORAGE_CURRENT_PAGE)||'home';
        navigate(last,true);
        if(isAdmin && !isMobile){
            document.getElementById('adminPanelBtn').classList.remove('hidden');
            document.getElementById('logoutAdminBtn').classList.remove('hidden');
        } else {
            document.getElementById('adminPanelBtn').classList.add('hidden');
            document.getElementById('logoutAdminBtn').classList.add('hidden');
        }
    }

    function init() {
        isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth<768;
        loadData();
        renderAllProducts(); renderCart(); restorePage();
        setupImagePreviews();
        document.getElementById('filterCat')?.addEventListener('change',refreshFilters);
        document.getElementById('filterPrice')?.addEventListener('change',refreshFilters);
        document.getElementById('searchInput')?.addEventListener('input',refreshFilters);
        document.getElementById('brandName')?.addEventListener('click',handleBrandClick);
        initDarkMode(); initTypingEffect(); initVoiceSearch();
        if(isAdmin && document.getElementById('homeView').style.display!=='none') startActiveUsersCounter();
    }

    window.app = {
        navigate, showDetail, addToCart, addToCartFromDetail, updateCartItem, removeCartItem,
        nextImage, prevImage, sendWhatsApp, addProduct, deleteProduct, logoutAdmin, filterAndNavigate
    };
    window.app.updateCartItem = updateCartItem; window.app.removeCartItem = removeCartItem;
    window.app.addToCart = addToCart; window.app.showDetail = showDetail;
    window.app.nextImage = nextImage; window.app.prevImage = prevImage;
    window.app.sendWhatsApp = sendWhatsApp; window.app.addProduct = addProduct;
    window.app.deleteProduct = deleteProduct; window.app.navigate = navigate;
    window.app.addToCartFromDetail = addToCartFromDetail; window.app.logoutAdmin = logoutAdmin;
    window.app.filterAndNavigate = filterAndNavigate;
    window.exportProducts = exportProducts; window.importProducts = importProducts;

    init();
</script>
</body>
</html>
